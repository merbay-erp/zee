map $request_method $zeedili_upstream_method {
    default $request_method;
    HEAD GET;
}

server {
    listen 80;
    listen [::]:80;
    server_name zeedili.com www.zeedili.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://zeedili.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zeedili.com;

    ssl_certificate /etc/letsencrypt/live/zeedili.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zeedili.com/privkey.pem;
    return 301 https://zeedili.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zeedili.com;

    ssl_certificate /etc/letsencrypt/live/zeedili.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zeedili.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ZEEDILI_TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' __JSON_LD_HASH__; style-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    location /assets/ {
        alias /opt/zeedili/static/;
        expires 1h;
    }

    location = /robots.txt {
        alias /opt/zeedili/static/robots.txt;
        default_type text/plain;
    }

    location = /sitemap.xml {
        alias /opt/zeedili/static/sitemap.xml;
        default_type application/xml;
    }

    location = /manifest.webmanifest {
        alias /opt/zeedili/static/manifest.webmanifest;
        default_type application/manifest+json;
    }

    # Depo belgeleri: dağıtım öncesi Zee üreticisiyle uretilen/belge/ altına yazılır.
    location = /belge {
        return 308 $scheme://$host/belge/;
    }

    location = /belge/ {
        root /opt/zeedili/uretilen;
        try_files /belge/index.html =404;
        charset utf-8;
        expires 10m;
    }

    location ~ ^/belge/([a-z0-9-]+)$ {
        return 308 $scheme://$host/belge/$1/;
    }

    location ~ ^/belge/([a-z0-9-]+)/$ {
        root /opt/zeedili/uretilen;
        try_files /belge/$1.html =404;
        charset utf-8;
        expires 10m;
    }

    location ~ ^/(playground|dil|ogren|ornekler|belgeler|manifesto|yol-haritasi|topluluk|indir)$ {
        return 308 $scheme://$host$uri/;
    }

    location / {
        proxy_pass http://127.0.0.1:8126;
        proxy_method $zeedili_upstream_method;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "for=$remote_addr;proto=https;host=$host";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }
}
