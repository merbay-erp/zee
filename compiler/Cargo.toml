[package]
name = "dil"
version = "0.7.0"
edition = "2021"
default-run = "dil"
description = "Türkçe programlama dili — bootstrap derleyici (Stage 0)"

[[bin]]
name = "dil"
path = "src/main.rs"

# Not: cdylib burada bildirilmez — Windows'ta bin ile PDB adı çakışıp uyarı
# üretiyordu (K-040). Playground, hedefe özgü olarak şöyle derlenir:
#   cargo rustc --release --target wasm32-unknown-unknown --lib --crate-type cdylib
[lib]
name = "dil"
path = "src/lib.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
getrandom = "0.4.3"
rpassword = "7.5.4"
