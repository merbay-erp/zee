[package]
name = "dil"
version = "0.7.0"
edition = "2021"
default-run = "dil"
description = "Türkçe programlama dili — bootstrap derleyici (Stage 0)"

[[bin]]
name = "dil"
path = "src/main.rs"

# Not: cdylib burada bildirilmez — Windows'ta bin ile PDB adı çakışıp uyarı
# üretiyordu (K-040). Playground, hedefe özgü olarak şöyle derlenir:
#   cargo rustc --release --target wasm32-unknown-unknown --lib --crate-type cdylib
[lib]
name = "dil"
path = "src/lib.rs"

[dependencies]
num-bigint = "0.5.1"
num-traits = "0.2.19"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
rpassword = "7.5.4"
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "1.0.151"
unicode-normalization = "0.1.25"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
