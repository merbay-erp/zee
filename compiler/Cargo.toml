[package]
name = "dil"
version = "1.0.0-dev"
edition = "2021"
default-run = "dil"
description = "Türkçe programlama dili — bootstrap derleyici (Stage 0)"
license = "MIT"
publish = false

[[bin]]
name = "dil"
path = "src/main.rs"

# Not: cdylib burada bildirilmez — Windows'ta bin ile PDB adı çakışıp uyarı
# üretiyordu (K-040). Playground, hedefe özgü olarak şöyle derlenir:
#   cargo rustc --release --target wasm32-unknown-unknown --lib --crate-type cdylib
[lib]
name = "dil"
path = "src/lib.rs"

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
bcrypt = { version = "=0.19.3", default-features = false, features = ["std", "zeroize"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
native-tls = "=0.2.18"
postgres = "=0.19.14"
postgres-protocol = "=0.6.12"
postgres-native-tls = "=0.5.3"
r2d2 = "=0.8.10"
r2d2_postgres = "=0.18.2"
rpassword = "7.5.4"
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
# K-381 A2b: sunucu TLS'i; ureq'in kilitli aynı rustls/ring yığını, yeni crate yok.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# K-397 (ADR-173): giden istemci TLS kökleri; ureq'in kilitli aynı sürümü, yeni crate yok.
webpki-roots = "=1.0.10"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

# K-362: bağımsız HTTP kâhini yalnız testte; ureq-proto ile aynı kilitli sürüm.
[dev-dependencies]
httparse = "=1.10.1"

[patch.crates-io]
postgres-protocol = { path = "third_party/postgres-protocol" }

# K-389: Linux debug `dil` gömülü DWARF ile 128 MiB'ı aştı; yürütülebilir dosya
# özetleyen betiklerin (effect-dispatcher, modul-yoneticisi, linux-private-
# carrier…) 128 MiB okuma tavanı bir güvenlik/kaynak sınırıdır ve korunur.
# Hata ayıklama bilgisi `.dwo` dosyalarında kalır (macOS'ta zaten varsayılan,
# Windows PDB etkilenmez); release profili ve sürüm artefaktı değişmez.
[profile.dev]
split-debuginfo = "unpacked"
