[package]
name = "dil-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"

[dependencies.dil]
path = ".."
version = "=0.8.0-dev"

[[bin]]
name = "lexer_parser"
path = "fuzz_targets/lexer_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "morfoloji"
path = "fuzz_targets/morfoloji.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_istegi"
path = "fuzz_targets/http_istegi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wasm_abi"
path = "fuzz_targets/wasm_abi.rs"
test = false
doc = false
bench = false

[patch.crates-io]
postgres-protocol = { git = "https://github.com/merbay-erp/zee", rev = "a4d7f208bc1bf01255f5ae9a16ebb97a74ff0d84" }
