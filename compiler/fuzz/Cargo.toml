[package]
name = "dil-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
# K-362: http_istegi hedefinin bağımsız kâhini; ureq-proto ile aynı kilitli sürüm.
httparse = "=1.10.1"
# K-390: dns_yaniti hedefinin bağımsız kâhini; derleyicinin dev-dependency sürümü.
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }

[dependencies.dil]
path = ".."
version = "=1.0.0-dev"

[[bin]]
name = "lexer_parser"
path = "fuzz_targets/lexer_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "morfoloji"
path = "fuzz_targets/morfoloji.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_istegi"
path = "fuzz_targets/http_istegi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_yaniti"
path = "fuzz_targets/dns_yaniti.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dkim_imza_girdisi"
path = "fuzz_targets/dkim_imza_girdisi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "x509_spki"
path = "fuzz_targets/x509_spki.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wasm_abi"
path = "fuzz_targets/wasm_abi.rs"
test = false
doc = false
bench = false

[patch.crates-io]
postgres-protocol = { path = "../third_party/postgres-protocol" }

[[bin]]
name = "kodlama"
path = "fuzz_targets/kodlama.rs"
test = false
doc = false
bench = false

[[bin]]
name = "psl"
path = "fuzz_targets/psl.rs"
test = false
doc = false
bench = false
