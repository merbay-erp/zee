# K-173/ADR-069: haftalık 30 dakikalık compiler + dillsp soak; RSS büyümesi
# ısınma sonrası %10 ve 32 MiB'ı birlikte aşarsa kapı kırılır.
name: soak

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
        with:
          toolchain: 1.93.1
      - name: 30 dakikalık soak
        working-directory: compiler
        shell: bash
        run: |
          cargo build --locked --release --bin dillsp --bin soak
          target/release/soak --sure-sn 1800 --pencere-sn 60 \
            --dillsp target/release/dillsp \
            --rapor "$RUNNER_TEMP/soak.md" \
            --gecmis "$RUNNER_TEMP/soak-gecmisi.tsv"
          cat "$RUNNER_TEMP/soak.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Soak artefaktını sakla
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-${{ github.sha }}
          path: |
            ${{ runner.temp }}/soak.md
            ${{ runner.temp }}/soak-gecmisi.tsv
          retention-days: 90
