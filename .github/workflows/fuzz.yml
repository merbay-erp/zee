name: lexer-parser-fuzz

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

jobs:
  lexer-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sabit nightly araç zinciri
        run: rustup toolchain install nightly-2026-08-31 --profile minimal
      - name: Sabit cargo-fuzz
        run: cargo +nightly-2026-08-31 install cargo-fuzz --version 0.13.2 --locked
      - name: Önceki kapsama korpusunu geri yükle
        uses: actions/cache@v4
        with:
          path: compiler/fuzz/corpus/lexer_parser
          key: lexer-parser-fuzz-${{ github.run_id }}
          restore-keys: |
            lexer-parser-fuzz-
      - name: Korpustan başlayarak lexer/parser fuzz
        working-directory: compiler
        run: >-
          cargo +nightly-2026-08-31 fuzz run lexer_parser fuzz/corpus/lexer_parser --
          -dict=fuzz/dictionaries/zee.dict
          -max_total_time=300
          -max_len=65536
          -timeout=5
      - name: Crash girdisini sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lexer-parser-fuzz-crash-${{ github.run_id }}
          path: compiler/fuzz/artifacts/lexer_parser
          if-no-files-found: ignore
