name: compiler-fuzz

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hedef:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - hedef: lexer_parser
            korpus: lexer_parser
            azami_girdi: 65536
          - hedef: morfoloji
            korpus: morfoloji
            azami_girdi: 128
          - hedef: http_istegi
            korpus: http_istegi
            azami_girdi: 81920
          - hedef: wasm_abi
            korpus: wasm_abi
            azami_girdi: 4097
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sabit nightly araç zinciri
        run: rustup toolchain install nightly-2026-08-31 --profile minimal
      - name: Sabit cargo-fuzz
        run: cargo +nightly-2026-08-31 install cargo-fuzz --version 0.13.2 --locked
      - name: Önceki kapsama korpusunu geri yükle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: compiler/fuzz/corpus/${{ matrix.korpus }}
          key: ${{ matrix.hedef }}-fuzz-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.hedef }}-fuzz-
      - name: Korpustan başlayarak ${{ matrix.hedef }} fuzz
        working-directory: compiler
        run: >-
          cargo +nightly-2026-08-31 fuzz run ${{ matrix.hedef }} fuzz/corpus/${{ matrix.korpus }} --
          -dict=fuzz/dictionaries/zee.dict
          -max_total_time=300
          -max_len=${{ matrix.azami_girdi }}
          -timeout=5
      - name: Öğrenilen korpusu provenance ile paketle
        if: always()
        env:
          FUZZ_HEDEF: ${{ matrix.hedef }}
          FUZZ_KORPUS: ${{ matrix.korpus }}
          FUZZ_ARTEFAKT: ${{ runner.temp }}/zee-fuzz-corpus-${{ matrix.hedef }}
        run: |
          rm -rf "$FUZZ_ARTEFAKT"
          mkdir -p "$FUZZ_ARTEFAKT/corpus"
          cp -a "compiler/fuzz/corpus/$FUZZ_KORPUS/." "$FUZZ_ARTEFAKT/corpus/"
          {
            echo "# zee-fuzz-corpus-artifact-1"
            printf '# target\t%s\n' "$FUZZ_HEDEF"
            printf '# corpus\t%s\n' "$FUZZ_KORPUS"
            printf '# source_commit\t%s\n' "$GITHUB_SHA"
            printf '# run_id\t%s\n' "$GITHUB_RUN_ID"
            printf '# run_attempt\t%s\n' "$GITHUB_RUN_ATTEMPT"
            printf '# toolchain\tnightly-2026-08-31\n'
            printf '# cargo_fuzz\t0.13.2\n'
            printf '# seed_sha256\trelative_path\n'
            find "$FUZZ_ARTEFAKT/corpus" -type f -print0 | LC_ALL=C sort -z |
              while IFS= read -r -d '' dosya; do
                ozet="$(sha256sum "$dosya" | cut -d ' ' -f 1)"
                goreli="${dosya#"$FUZZ_ARTEFAKT/corpus/"}"
                printf '%s\t%s\n' "$ozet" "$goreli"
              done
          } > "$FUZZ_ARTEFAKT/manifest.tsv"
      - name: Öğrenilen korpusu her koşuda sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.hedef }}-fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zee-fuzz-corpus-${{ matrix.hedef }}
          if-no-files-found: error
          retention-days: 90
      - name: Crash girdisini sakla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.hedef }}-fuzz-crash-${{ github.run_id }}
          path: compiler/fuzz/artifacts/${{ matrix.hedef }}
          if-no-files-found: ignore
          retention-days: 90
