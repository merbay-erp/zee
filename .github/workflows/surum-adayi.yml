# K-168/ADR-068: sürüm adayı artefaktı — iki temiz klonda eş SHA-256, SBOM,
# provenance ve (secret varsa) imza. Etiket ve elle tetiklenir.
name: surum-adayi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tekrar-uretilebilir-surum:
    # K-317: üç platform; açık depoda GitHub'ın kendi makineleri (self-hosted yasak).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ad: linux-x86_64
          - os: macos-latest
            ad: macos-arm64
          - os: windows-latest
            ad: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.93.1
      - name: Birleşik güvenlik kapısı (sürüm adayı kipi öncesi sürekli kip)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          bash scripts/guvenlik-kapisi.sh --surekli
      - name: İki temiz klonda tekrar üretilebilir derleme, SBOM ve provenance
        env:
          ZEE_SURUM_ANAHTARI: ${{ secrets.ZEE_SURUM_ANAHTARI }}
        shell: bash
        run: |
          if [[ -n "${ZEE_SURUM_ANAHTARI:-}" ]]; then
            umask 077
            printf '%s\n' "$ZEE_SURUM_ANAHTARI" > "$RUNNER_TEMP/surum.zee-anahtar"
            bash scripts/surum-artefakti.sh --cikti "$RUNNER_TEMP/surum" --anahtar "$RUNNER_TEMP/surum.zee-anahtar"
            rm -f "$RUNNER_TEMP/surum.zee-anahtar"
          else
            bash scripts/surum-artefakti.sh --cikti "$RUNNER_TEMP/surum"
          fi
          cat "$RUNNER_TEMP/surum/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
      - name: Sürüm artefaktını sakla
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surum-${{ github.sha }}-${{ matrix.ad }}
          path: ${{ runner.temp }}/surum
          retention-days: 90

  # K-317/ADR-156: yalnız v* etiketinde; imza sabit yayıncı anahtarıyla doğrulanmadan yayın yok.
  yayinla:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tekrar-uretilebilir-surum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: surum-${{ github.sha }}-*
          path: ${{ runner.temp }}/indirilen
      - name: İmzaları doğrula ve paketle
        shell: bash
        run: |
          set -euo pipefail
          etiket="${GITHUB_REF_NAME}"
          mkdir -p "$RUNNER_TEMP/yayin"
          for klasor in "$RUNNER_TEMP"/indirilen/surum-${GITHUB_SHA}-*; do
            ad="${klasor##*/surum-${GITHUB_SHA}-}"
            test -f "$klasor/SHA256SUMS.zee-imza" || { echo "$ad imzasız; resmî yayın yapılmaz" >&2; exit 1; }
            bash scripts/imza-dogrula.sh "$klasor"
            tar -C "$klasor" -czf "$RUNNER_TEMP/yayin/zee-${etiket}-${ad}.tar.gz" .
          done
          (cd "$RUNNER_TEMP/yayin" && sha256sum zee-*.tar.gz > ZEE-PAKETLERI.sha256)
      - name: GitHub sürümü
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/yayin/* --repo "$GITHUB_REPOSITORY" \
            --title "zee $GITHUB_REF_NAME" --verify-tag \
            --notes "İmzalı resmî sürüm. Yayıncı anahtarı: docs/yayinci-anahtari-v1.txt · doğrulama: bash scripts/imza-dogrula.sh <açılan-klasör> · notlar: docs/surumler.md"
