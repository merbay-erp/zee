# Golden korpus + derleyici CI'ı (master plan bölüm 27).
# Depo bir GitHub uzak sunucusuna itildiğinde kendiliğinden çalışır.
# Tier-1 hedefleri: Linux x86-64, macOS ARM64, Windows x86-64.

name: dil

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml sürümü sabitler; action yalnız rustup'ı hazırlar.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Testler (golden korpus + biçimleyici)
        working-directory: compiler
        run: cargo test --locked || cargo test
      - name: Uyarı yok
        working-directory: compiler
        shell: bash
        run: |
          cikti="$(cargo build 2>&1)"
          printf '%s\n' "$cikti"
          case "$cikti" in
            *warning*|*Warning*) echo "UYARI BULUNDU — temiz derleme ilkesi (RFC-0001 §11)"; exit 1 ;;
          esac
      - name: Clippy temiz
        working-directory: compiler
        run: cargo clippy --all-targets -- -D warnings
      - name: Fuzz hedefi stable araç zincirinde derlenir
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --bin lexer_parser
      - name: Milestone dosyası çalışıyor
        working-directory: compiler
        run: cargo run -- çalıştır ../merhaba.dil
      # Ölçüm koşucusu derlenir ve koşar (bölüm 22; süre eşiği YOK — CI
      # makineleri gürültülü, sayılar yalnız yerel release arşivine girer).
      - name: Ölçüm koşucusu çalışır
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        run: cargo run --release --bin olcum -- --hizli
      # Playground çekirdeği wasm hedefinde derlenmeye devam etmeli (K-039/K-040).
      - name: Playground (wasm) derlenir
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        run: cargo rustc --release --target wasm32-unknown-unknown --lib --crate-type cdylib -- -C link-arg=-zstack-size=16777216
