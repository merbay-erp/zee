# Golden korpus + derleyici CI'ı (master plan bölüm 27).
# Depo bir GitHub uzak sunucusuna itildiğinde kendiliğinden çalışır.
# Tier-1 hedefleri: Linux x86-64, macOS ARM64, Windows x86-64.

name: dil

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # K-319: Python testleri ast.dump çıktısını özetler; sürüm farkı özetleri değiştirir. Yerel kabul ortamıyla aynı sürüm.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"
      - name: python3 komutu (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          command -v python3 >/dev/null || cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
          python3 --version
      - name: Yayımlanmış conformance artefaktları immutable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          ZEE_CONFORMANCE_TABANI: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ZEE_CONFORMANCE_TABANI="$(python3 scripts/ci-taban-kimligi.py "$ZEE_CONFORMANCE_TABANI")"
          bash scripts/conformance-korugu.sh "$ZEE_CONFORMANCE_TABANI"
      - name: Semantic regresyon vaka soy ağacı kalıcı
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          ZEE_REGRESYON_TABANI: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ZEE_REGRESYON_TABANI="$(python3 scripts/ci-taban-kimligi.py "$ZEE_REGRESYON_TABANI")"
          bash scripts/semantic-regresyon-korugu.sh "$ZEE_REGRESYON_TABANI"
      - name: Core freeze gerçek dogfood kanıtı olmadan açılamaz
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          ZEE_CORE_FREEZE_TABANI: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ZEE_CORE_FREEZE_TABANI="$(python3 scripts/ci-taban-kimligi.py "$ZEE_CORE_FREEZE_TABANI")"
          bash scripts/core-freeze-korugu.sh "$ZEE_CORE_FREEZE_TABANI"
      # rust-toolchain.toml sürümü sabitler; action yalnız rustup'ı hazırlar.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.93.1
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - name: Exact kaynak CI ve deterministik build kimliği izolasyonu
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 scripts/tests/kaynak-ci-esleme-test.py
          python3 scripts/tests/build-kimligi-test.py
      - name: Faza özgü test matrisi
        working-directory: compiler
        shell: bash
        run: cargo run --locked --bin faz_test_matrisi -- --denetle --rapor target/faz-test-matrisi.md
      - name: Hermetik gerçek PostgreSQL TLS CA hostname ve NULL kapısı
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 openssl
          python3 scripts/tests/postgresql-tls-ci-test.py
          python3 scripts/postgresql-tls-ci.py --engine local --postgres-bin-dir /usr/lib/postgresql/16/bin
          python3 scripts/postgresql-goc-ci.py --engine local --postgres-bin-dir /usr/lib/postgresql/16/bin
          python3 scripts/tests/parola-goc-ci-test.py
          python3 scripts/parola-goc-ci.py --engine local --postgres-bin-dir /usr/lib/postgresql/16/bin
      - name: Faz matrisini iş özetine ekle
        if: always()
        working-directory: compiler
        shell: bash
        run: |
          if [[ -f target/faz-test-matrisi.md ]]; then
            cat target/faz-test-matrisi.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Faz matrisi artefaktını sakla
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faz-test-matrisi-${{ matrix.os }}
          path: |
            compiler/target/faz-test-matrisi.md
            compiler/target/postgresql-tls-ci.json
            compiler/target/postgresql-tls-ci.log
            compiler/target/postgresql-goc-ci.json
            compiler/target/postgresql-goc-ci.log
            compiler/target/parola-goc-ci.json
          if-no-files-found: warn
      - name: Uyarı yok
        working-directory: compiler
        shell: bash
        run: |
          cikti="$(cargo build --locked 2>&1)"
          printf '%s\n' "$cikti"
          case "$cikti" in
            *warning*|*Warning*) echo "UYARI BULUNDU — temiz derleme ilkesi (RFC-0001 §11)"; exit 1 ;;
          esac
      - name: Clippy temiz
        working-directory: compiler
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust kaynakları kanonik biçimde
        working-directory: compiler
        run: cargo fmt --all -- --check
      - name: Kritik işlev büyüme ve karmaşıklık eğilimi temiz
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        run: cargo run --locked --bin islev_egilimi -- --denetle
      - name: Spec maddeleri exact test kanıtı taşır
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        run: cargo run --locked --bin spec_drift -- --denetle
      - name: Tanı kalitesi (öneri/işaret/gürültü) sınır içinde
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        run: cargo run --locked --bin tani_kalitesi -- --denetle
      # K-164/ADR-072: ikinci ürün gerçek CLI ile sayfayı yeniden üretir; bayatsa kırılır.
      - name: Kanıt özeti sayfası ikinci Zee ürünüyle güncel
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        shell: bash
        run: |
          cargo run --locked -- çalıştır ../dogfood/kanit-ozeti/kaynak/ana.dil
          git diff --exit-code -- ../docs/kanit-ozeti.md
      - name: Fuzz hedefleri stable araç zincirinde derlenir
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --bins
      - name: Milestone dosyası çalışıyor
        working-directory: compiler
        run: cargo run --locked -- çalıştır ../merhaba.dil
      # Shared runner gürültülüdür: p50/p95 gözlemi yayımlanır, hard eşik yoktur.
      # Eşik yalnız sabitlenmiş adanmış koşucuda açık --esik-yuzde ile istenir.
      - name: Performans p50/p95 gözlemi yayımlanır
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        shell: bash
        run: |
          cargo build --locked --release --bin dillsp
          cargo run --locked --release --bin olcum -- \
            --tur 25 \
            --gecmis ../docs/performans-gecmisi-v2.tsv \
            --json target/performans.json \
            --rapor target/performans.md \
            --gecmis-cikti target/performans-gecmisi.tsv \
            --kayit "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --git-sha "$GITHUB_SHA" \
            --milestone shared-ci \
            --dillsp target/release/dillsp \
            --lsp-olcek
          cat target/performans.md >> "$GITHUB_STEP_SUMMARY"
      - name: Performans gözlemi artefaktını yükle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performans-${{ github.sha }}
          path: |
            compiler/target/performans.json
            compiler/target/performans.md
            compiler/target/performans-gecmisi.tsv
          retention-days: 90
      # Playground çekirdeği wasm hedefinde derlenmeye devam etmeli (K-039/K-040).
      - name: Playground (wasm) derlenir
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        run: cargo rustc --locked --release --target wasm32-unknown-unknown --lib --crate-type cdylib -- -C link-arg=-zstack-size=16777216
      - name: Playground ABI v3 gerçek wasm hostunda çalışır
        if: matrix.os == 'ubuntu-latest'
        working-directory: compiler
        run: node ../scripts/wasm-abi-denetle.mjs target/wasm32-unknown-unknown/release/dil.wasm
