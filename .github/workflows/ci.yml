# Golden korpus + derleyici CI'ı (master plan bölüm 27).
# Depo bir GitHub uzak sunucusuna itildiğinde kendiliğinden çalışır.
# Tier-1 hedefleri: Linux x86-64, macOS ARM64, Windows x86-64.

name: dil

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml sürümü sabitler; action yalnız rustup'ı hazırlar.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: clippy
      - name: Testler (golden korpus + biçimleyici)
        working-directory: compiler
        run: cargo test --locked || cargo test
      - name: Uyarı yok
        working-directory: compiler
        shell: bash
        run: |
          cikti="$(cargo build 2>&1)"
          printf '%s\n' "$cikti"
          case "$cikti" in
            *warning*|*Warning*) echo "UYARI BULUNDU — temiz derleme ilkesi (RFC-0001 §11)"; exit 1 ;;
          esac
      - name: Clippy temiz
        working-directory: compiler
        run: cargo clippy --all-targets -- -D warnings
      - name: Milestone dosyası çalışıyor
        working-directory: compiler
        run: cargo run -- çalıştır ../merhaba.dil
