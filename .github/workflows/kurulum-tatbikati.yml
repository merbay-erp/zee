# K-169/ADR-071: üç Tier-1 platformda kurulum → dil sürüm → kaldırma tatbikatı.
name: kurulum-tatbikati

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tatbikat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.93.1
      - name: "Sürüm artefaktı (Unix: iki temiz klon)"
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/surum-artefakti.sh --cikti "$RUNNER_TEMP/surum"
      - name: "Sürüm artefaktı (Windows: tek derleme + SHA256SUMS)"
        if: runner.os == 'Windows'
        shell: bash
        working-directory: compiler
        run: |
          cargo build --locked --release --bin dil --bin dillsp
          mkdir -p "$RUNNER_TEMP/surum"
          cp target/release/dil.exe target/release/dillsp.exe "$RUNNER_TEMP/surum/"
          cargo run --locked --bin surum_artefakti -- ozet "$RUNNER_TEMP/surum" dil.exe dillsp.exe > "$RUNNER_TEMP/surum/SHA256SUMS"
          git rev-parse HEAD > "$RUNNER_TEMP/surum/GIT_SHA"
      - name: Kur → sürüm → kaldır (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/kur.sh --artefakt "$RUNNER_TEMP/surum" --hedef "$RUNNER_TEMP/bin" --veri "$RUNNER_TEMP/veri"
          "$RUNNER_TEMP/bin/dil" sürüm
          bash scripts/kaldir.sh --veri "$RUNNER_TEMP/veri"
          test ! -e "$RUNNER_TEMP/bin/dil" && test ! -e "$RUNNER_TEMP/veri/kurulum-v1.tsv"
      - name: Kur → sürüm → kaldır (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -File scripts/kur.ps1 -Artefakt "$env:RUNNER_TEMP\surum" -Hedef "$env:RUNNER_TEMP\bin" -Veri "$env:RUNNER_TEMP\veri"
          & "$env:RUNNER_TEMP\bin\dil.exe" sürüm
          powershell -File scripts/kaldir.ps1 -Veri "$env:RUNNER_TEMP\veri"
          if (Test-Path "$env:RUNNER_TEMP\bin\dil.exe") { throw "kaldırma başarısız" }
