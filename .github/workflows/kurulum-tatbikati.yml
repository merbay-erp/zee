# K-169/ADR-071: üç Tier-1 platformda kurulum → dil sürüm → kaldırma tatbikatı.
name: kurulum-tatbikati

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Release üretimi veya mevcut exact release için temiz Windows runtime"
        type: choice
        default: release
        options:
          - release
          - clean-windows
          - clean-windows-install
          - toolchain-probe
      source_run:
        description: "clean-windows: başarılı Windows artefaktının run kimliği"
        required: false
      source_sha:
        description: "clean-windows: release kaynağının exact SHA'sı"
        required: false

permissions:
  contents: read

jobs:
  tatbikat:
    if: inputs.mode != 'clean-windows' && inputs.mode != 'clean-windows-install' && inputs.mode != 'toolchain-probe'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
        with:
          toolchain: 1.93.1
      - name: Çalışma ortamı ret regresyonları
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/tests/calisma-ortami-test.py
            python scripts/tests/derleme-ortami-test.py
            python scripts/tests/native-deployment-test.py
          else
            python3 scripts/tests/calisma-ortami-test.py
            python3 scripts/tests/derleme-ortami-test.py
            python3 scripts/tests/native-deployment-test.py
          fi
      - name: "Sürüm artefaktı (üç platform: iki temiz klon)"
        shell: bash
        env:
          ZEE_SURUM_TANI_DIZINI: ${{ runner.temp }}/surum-farki
        run: bash scripts/surum-artefakti.sh --cikti "$RUNNER_TEMP/surum"
      - name: Kur → sürüm → kaldır (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/kur.sh --artefakt "$RUNNER_TEMP/surum" --hedef "$RUNNER_TEMP/bin" --veri "$RUNNER_TEMP/veri"
          "$RUNNER_TEMP/bin/dil" sürüm
          python3 scripts/calisma-ortami-denetle.py --artefakt "$RUNNER_TEMP/surum" --kurulu "$RUNNER_TEMP/bin" --rapor "$RUNNER_TEMP/calisma-ortami.json" --beklenen-sha "$GITHUB_SHA"
          bash scripts/kaldir.sh --veri "$RUNNER_TEMP/veri"
          test ! -e "$RUNNER_TEMP/bin/dil" && test ! -e "$RUNNER_TEMP/veri/kurulum-v1.tsv"
      - name: Kur → sürüm → kaldır (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/kurulum-literal-yol-test.ps1
          if ($LASTEXITCODE -ne 0) { throw "literal yol kampanyası başarısız" }
          powershell -File scripts/kur.ps1 -Artefakt "$env:RUNNER_TEMP\surum" -Hedef "$env:RUNNER_TEMP\bin" -Veri "$env:RUNNER_TEMP\veri"
          & "$env:RUNNER_TEMP\bin\dil.exe" sürüm
          if ($LASTEXITCODE -ne 0) { throw "dil sürüm başarısız" }
          python scripts/calisma-ortami-denetle.py --artefakt "$env:RUNNER_TEMP\surum" --kurulu "$env:RUNNER_TEMP\bin" --rapor "$env:RUNNER_TEMP\calisma-ortami.json" --beklenen-sha "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "çalışma ortamı denetimi başarısız" }
          $rapor = Get-Content -Raw -Encoding UTF8 "$env:RUNNER_TEMP\calisma-ortami.json" | ConvertFrom-Json
          if ($rapor.crt_sozlesmesi -ne "statik-crt-import-yok") { throw "statik CRT kanıtı yok" }
          powershell -File scripts/kaldir.ps1 -Veri "$env:RUNNER_TEMP\veri"
          if (Test-Path "$env:RUNNER_TEMP\bin\dil.exe") { throw "kaldırma başarısız" }
      - name: Exact kaynak ve çalışma ortamı kanıtını sakla
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calisma-ortami-${{ github.sha }}-${{ runner.os }}
          path: |
            ${{ runner.temp }}/calisma-ortami.json
            ${{ runner.temp }}/surum
          if-no-files-found: error
          retention-days: 90

      - name: Başarısız çift-klon ikililerini tanı için sakla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yayinlanamaz-surum-farki-${{ github.sha }}-${{ runner.os }}
          path: ${{ runner.temp }}/surum-farki
          if-no-files-found: ignore
          retention-days: 90
  arac_zinciri_provasi:
    if: inputs.mode == 'toolchain-probe'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
        with:
          toolchain: 1.93.1
      - name: Exact compiler ve Cargo config provası
        shell: bash
        env:
          ZEE_PIN_RAPOR: ${{ runner.temp }}/rustc-pin.json
        run: bash scripts/tests/rust-arac-zinciri-gercek-test.sh
      - name: Compiler pin kanıtını koru
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustc-pin-${{ github.sha }}-${{ runner.os }}
          path: ${{ runner.temp }}/rustc-pin.json
          if-no-files-found: error
          retention-days: 90
  temiz_windows:
    if: inputs.mode == 'clean-windows' || inputs.mode == 'clean-windows-install'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kaynak/ikili/LSP ret kapıları
        shell: pwsh
        run: |
          python scripts/tests/temiz-windows-test.py
          if ($LASTEXITCODE -ne 0) { throw "runtime ret tests failed" }
          python scripts/tests/temiz-windows-kurulum-test.py
          if ($LASTEXITCODE -ne 0) { throw "install ret tests failed" }
      - name: Exact Windows release artefaktını indir
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:SOURCE_RUN -notmatch '^[0-9]+$' -or $env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw "invalid source identity" }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name "calisma-ortami-$env:SOURCE_SHA-Windows" --dir "$env:RUNNER_TEMP\source"
          if ($LASTEXITCODE -ne 0) { throw "source artifact download failed" }
      - name: Nano Server program ve LSP provası
        if: inputs.mode == 'clean-windows'
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python scripts/temiz-windows-prova.py --artefakt "$env:RUNNER_TEMP\source\surum" --beklenen-sha $env:SOURCE_SHA --rapor "$env:RUNNER_TEMP\temiz-windows.json"
          if ($LASTEXITCODE -ne 0) { throw "clean runtime proof failed" }
      - name: Server Core kurulum program LSP ve kaldırma provası
        if: inputs.mode == 'clean-windows-install'
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python scripts/temiz-windows-kurulum-prova.py --artefakt "$env:RUNNER_TEMP\source\surum" --beklenen-sha $env:SOURCE_SHA --rapor "$env:RUNNER_TEMP\temiz-windows.json"
          if ($LASTEXITCODE -ne 0) { throw "clean install proof failed" }
      - name: Runtime kanıtını veya başarısızlık kaydını koru
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temiz-windows-${{ inputs.source_sha }}-prova-${{ github.sha }}
          path: ${{ runner.temp }}/temiz-windows.json
          if-no-files-found: error
          retention-days: 90
